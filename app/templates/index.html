{% extends 'base.html' %}

{% block content %}
<div class="row text-center mb-4">
    <div class="col-12">
        <h1 class="display-5">Chào mừng đến với cửa hàng của chúng tôi!</h1>
        <p class="lead">Sản phẩm chất lượng - Thanh toán nhanh chóng.</p>
    </div>
    <form class="d-flex mx-auto search-box position-relative" onsubmit="return false;">
        <input class="form-control me-2" id="search-input" type="search" placeholder="Tìm kiếm sản phẩm..." autocomplete="off">
        <button class="btn btn-outline-dark" type="submit">
            <i class="bi bi-search"></i>
        </button>
        <div id="search-results" class="dropdown-menu w-100 shadow-sm mt-1" style="display: none; position: absolute; top: 100%; left: 0; z-index: 1050; max-height: 300px; overflow-y: auto;"></div>
    </form>
</div>

<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <img src="{{ product.image_url }}" class="card-img-top" alt="{{ product.name }}" style="height: 250px; object-fit: contain; padding: 10px;">

            <div class="card-body d-flex flex-column justify-content-center">
                <h5 class="card-title text-center mb-0">{{ product.name }}</h5>
            </div>

            <div class="card-footer text-center bg-white">
                <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn btn-primary">Xem chi tiết</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");

    if (searchInput && searchResults) {
        searchInput.addEventListener("input", function() {
            const query = this.value.trim();

            // Nếu người dùng xóa hết chữ, ẩn ngay khung kết quả
            if (query.length === 0) {
                searchResults.style.display = "none";
                searchResults.innerHTML = "";
                return;
            }

            // Gọi API ngầm lên Flask Backend để lấy sản phẩm khớp từ khóa
            fetch(`/api/search?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(products => {
                    if (products.length === 0) {
                        // Nếu không tìm thấy sản phẩm nào khớp
                        searchResults.innerHTML = `<div class="dropdown-item text-muted small py-2">Không tìm thấy sản phẩm nào...</div>`;
                    } else {
                        // Nếu có sản phẩm, lặp qua và vẽ HTML hiển thị dạng danh sách có ảnh nhỏ và giá tiền
                        let htmlContent = "";
                        products.forEach(p => {
                            htmlContent += `
                                <a href="/product_id/${p.id}" class="dropdown-item d-flex align-items-center py-2 border-bottom" style="gap: 10px;">
                                    <img src="${p.image_url}" alt="${p.name}" style="width: 40px; height: 40px; object-fit: contain; border-radius: 4px;">
                                    <div style="white-space: normal;">
                                        <div class="fw-semibold text-dark small mb-0" style="line-height: 1.2;">${p.name}</div>
                                        <small class="text-primary fw-bold">${p.price}</small>
                                    </div>
                                </a>
                            `;
                        });
                        searchResults.innerHTML = htmlContent;
                    }
                    // Hiện khung dropdown kết quả lên màn hình
                    searchResults.style.display = "block";
                })
                .catch(err => console.error("Lỗi tìm kiếm:", err));
        });

        // Tự động đóng khung tìm kiếm nếu người dùng click chuột ra ngoài khu vực ô tìm kiếm
        document.addEventListener("click", function(event) {
            if (!searchInput.contains(event.target) && !searchResults.contains(event.target)) {
                searchResults.style.display = "none";
            }
        });
    }
});
</script>
{% endblock %}
